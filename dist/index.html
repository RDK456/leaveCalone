<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighten</title>
<script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="rail" aria-label="Main">
  <div class="mark" title="Lighten" aria-label="Lighten">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect class="a" x="2" y="9" width="22" height="8" rx="2"/><rect class="b" x="2" y="9" width="14" height="8" rx="2"/></svg>
  </div>
  <button class="nav on" data-view="overview" aria-label="Overview" title="Overview"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg></button>
  <button class="nav" data-view="clean" aria-label="Clean" title="Clean"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>
  <button class="nav" data-view="move" aria-label="Move to another drive" title="Move to another drive"><svg viewBox="0 0 20 20"><path d="M3 10h13M12 6l4 4-4 4"/></svg></button>
  <button class="nav" data-view="find" aria-label="Find files" title="Find files"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5"/><path d="M13 13l4 4"/></svg></button>
  <button class="nav" data-view="apps" aria-label="Installed apps" title="Installed apps"><svg viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h12"/></svg></button>
  <button class="nav" data-view="system" aria-label="System" title="System"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1"/><path d="M8 2v3M12 2v3M8 15v3M12 15v3M2 8h3M2 12h3M15 8h3M15 12h3"/></svg></button>
  <button class="nav" data-view="explore" aria-label="Explore folders" title="Explore folders"><svg viewBox="0 0 20 20"><path d="M3 5h5l2 2h7v8H3z"/></svg></button>
  <hr>
  <button class="nav" data-view="moved" aria-label="Moved folders" title="Moved folders"><svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 2-4.5M4 3v3h3"/></svg></button>
  <button class="nav" data-th aria-label="Switch light or dark theme" title="Light or dark" style="margin-top:auto"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
  <button class="nav" data-view="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6L15 15M5 15l1.4-1.4M13.6 6.4L15 5"/></svg></button>
</nav>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
<script src="find.js"></script>
<script src="tools.js"></script>
<script src="extra.js"></script>
<script src="help.js"></script>
</body>
</html>
